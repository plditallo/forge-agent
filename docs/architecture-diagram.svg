<svg width="680" height="880" viewBox="0 0 680 880" xmlns="http://www.w3.org/2000/svg" role="img">
<title>FORGE Agent architecture diagram</title>
<desc>Shows the browser connecting to the forge-agent Python service, which calls out to the Claude API for content validation and scoring, talks to an Azure SQL database, and talks to a separate forge-casper-bridge Node.js service. The bridge service signs and submits transactions to the Casper testnet, where the ForgeRegistry smart contract lives.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="880" fill="#ffffff"/>

<g>
  <rect x="470" y="20" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="555" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Claude API</text>
  <text x="555" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Content review, scoring</text>
</g>

<g>
  <rect x="120" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="220" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser</text>
  <text x="220" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Buyer, seller, admin UI</text>
</g>
<line x1="220" y1="76" x2="220" y2="116" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="40" y="116" width="600" height="220" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="64" y="144" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">forge-agent</text>
  <text x="64" y="162" font-family="sans-serif" font-size="12" fill="#3C3489">Python / FastAPI</text>
</g>

<g>
  <rect x="64" y="184" width="168" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="148" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Assessment engine</text>
  <text x="148" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">profiler.py, scorer.py</text>
  <text x="148" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Builds the prompt, parses</text>
  <text x="148" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">the tier from the response</text>
</g>

<g>
  <rect x="248" y="184" width="168" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="332" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Marketplace</text>
  <text x="332" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Listings, purchases</text>
  <text x="332" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">RBAC dashboards</text>
</g>

<g>
  <rect x="432" y="184" width="168" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="516" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">recorder.py</text>
  <text x="516" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Casper integration</text>
  <text x="516" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">entry point</text>
</g>

<path d="M148,184 L148,96 L470,48" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="178" y="84" width="148" height="20" fill="#ffffff"/>
<text x="252" y="94" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Content review + scoring</text>

<line x1="148" y1="336" x2="148" y2="376" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
  <rect x="48" y="376" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="148" y="396" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Azure SQL / SQL Server</text>
  <text x="148" y="414" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Users, assessments, listings</text>
</g>

<line x1="516" y1="336" x2="516" y2="376" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="486" y="346" width="60" height="20" fill="#ffffff"/>
<text x="516" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">HTTP</text>

<g>
  <rect x="416" y="376" width="200" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="516" y="396" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">forge-casper-bridge</text>
  <text x="516" y="412" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Node.js + Express</text>
  <text x="516" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Holds the signing key</text>
</g>

<line x1="516" y1="440" x2="516" y2="480" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="476" y="450" width="80" height="20" fill="#ffffff"/>
<text x="516" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">casper-js-sdk</text>

<g>
  <rect x="376" y="486" width="280" height="180" rx="20" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="400" y="514" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Casper testnet</text>
</g>

<g>
  <rect x="400" y="540" width="232" height="100" rx="12" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="516" y="568" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">ForgeRegistry contract</text>
  <text x="516" y="586" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">record_certification(...)</text>
  <text x="516" y="604" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">Odra / Rust / WASM</text>
</g>

<g>
  <rect x="40" y="486" width="300" height="180" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="64" y="514" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Why two services</text>
  <text x="64" y="538" font-family="sans-serif" font-size="12" fill="#444441">casper-types (Rust) fails to</text>
  <text x="64" y="554" font-family="sans-serif" font-size="12" fill="#444441">compile natively on Windows.</text>
  <text x="64" y="578" font-family="sans-serif" font-size="12" fill="#444441">casper-js-sdk has no native</text>
  <text x="64" y="594" font-family="sans-serif" font-size="12" fill="#444441">build step, so the bridge runs</text>
  <text x="64" y="610" font-family="sans-serif" font-size="12" fill="#444441">it as its own small service.</text>
  <text x="64" y="634" font-family="sans-serif" font-size="12" fill="#444441">The signing key lives only on</text>
  <text x="64" y="650" font-family="sans-serif" font-size="12" fill="#444441">the bridge, not the main app.</text>
</g>

<g>
  <rect x="40" y="696" width="600" height="160" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="64" y="724" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">What Claude actually does in this system</text>
  <text x="64" y="750" font-family="sans-serif" font-size="12" fill="#0C447C">1. Content validation -- reviews every uploaded file's profile and rejects content that violates</text>
  <text x="64" y="766" font-family="sans-serif" font-size="12" fill="#0C447C">   FORGE's marketplace policy (PII, offensive material, malicious data) before scoring begins.</text>
  <text x="64" y="790" font-family="sans-serif" font-size="12" fill="#0C447C">2. FORGE scoring -- evaluates the dataset across eight weighted dimensions plus four</text>
  <text x="64" y="806" font-family="sans-serif" font-size="12" fill="#0C447C">   monetization metrics, returning the Coal-to-Diamond tier with written reasoning per</text>
  <text x="64" y="822" font-family="sans-serif" font-size="12" fill="#0C447C">   dimension -- this is the actual certification judgment the whole platform is built around.</text>
</g>

</svg>