<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE Agent — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background: #1a1d27;
            border-bottom: 2px solid #c9a84c;
            padding: 20px 40px;
        }
        header h1 { font-size: 1.6rem; color: #c9a84c; letter-spacing: 2px; }
        header p { font-size: 0.85rem; color: #888; margin-top: 2px; }

        .container {
            max-width: 480px;
            margin: 80px auto;
            padding: 0 20px;
            width: 100%;
        }

        .card {
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 36px;
        }

        .card h2 {
            font-size: 1rem;
            color: #c9a84c;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background: #0f1117;
            border: 1px solid #2a2d3a;
            border-radius: 4px;
            padding: 10px 12px;
            color: #e0e0e0;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .form-group input:focus { outline: none; border-color: #c9a84c; }

        .btn {
            width: 100%;
            background: #c9a84c;
            color: #0f1117;
            border: none;
            border-radius: 4px;
            padding: 13px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn:hover { background: #e0c068; }

        .status {
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .status.error   { background: #2d1e1e; border-left: 3px solid #e05555; color: #e05555; display: block; }
        .status.success { background: #1e2d1e; border-left: 3px solid #55a055; color: #55a055; display: block; }
        .status.info    { background: #1e2d3d; border-left: 3px solid #4a9eda; color: #4a9eda; display: block; }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
        }

        .register-link a { color: #c9a84c; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }

        .forge-logo {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

<header>
    <h1>⚒ FORGE AGENT</h1>
    <p>Data Product Discovery & Monetization Platform</p>
</header>

<div class="container">
    <div class="card">
        <div class="forge-logo">⚒</div>
        <h2>Sign In</h2>
        <p class="subtitle">Enter your API key to access FORGE Agent.</p>

        <div id="loginStatus" class="status"></div>

        <div class="form-group">
            <label>API Key</label>
            <input type="text" id="api_key" placeholder="FORGE-XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX">
        </div>

        <button class="btn" onclick="login()">Sign In</button>

        <div class="register-link">
            Don't have an API key? <a href="/static/register.html">Register here</a>
        </div>
    </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

// If already logged in, redirect
if (localStorage.getItem('forge_api_key')) {
    window.location.href = '/static/index.html';
}

async function login() {
    const apiKey = document.getElementById('api_key').value.trim();
    const status = document.getElementById('loginStatus');

    if (!apiKey) {
        status.className = 'status error';
        status.textContent = 'Please enter your API key.';
        return;
    }

    status.className = 'status info';
    status.textContent = 'Verifying...';

    try {
        const res = await fetch(API + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: apiKey })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');

        localStorage.setItem('forge_api_key', apiKey);
        localStorage.setItem('forge_user_id', data.user_id);
        localStorage.setItem('forge_user_name', data.full_name);

        status.className = 'status success';
        status.textContent = 'Welcome back, ' + data.full_name + '!';

        setTimeout(() => {
            window.location.href = '/static/index.html';
        }, 1000);

    } catch (err) {
        status.className = 'status error';
        status.textContent = err.message;
    }
}

document.getElementById('api_key').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
