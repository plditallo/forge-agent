<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE Seller Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

        header {
            background: #1a1d27;
            border-bottom: 2px solid #c9a84c;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 1.6rem; color: #c9a84c; letter-spacing: 2px; }
        header p { font-size: 0.85rem; color: #888; margin-top: 2px; }
        .nav-links { display: flex; gap: 12px; align-items: center; }
        .nav-link { color: #c9a84c; text-decoration: none; font-size: 0.9rem; border: 1px solid #c9a84c; padding: 6px 16px; border-radius: 4px; }
        .nav-link:hover { background: #c9a84c; color: #0f1117; }
        .nav-link.active { background: #c9a84c; color: #0f1117; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        .card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 8px; padding: 28px; margin-bottom: 24px; }
        .card h2 { font-size: 1rem; color: #c9a84c; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-box { background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; padding: 16px; text-align: center; }
        .stat-box .val { font-size: 2rem; font-weight: 700; color: #c9a84c; line-height: 1; }
        .stat-box .lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-top: 6px; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

        .rev-table { width: 100%; border-collapse: collapse; }
        .rev-table th { text-align: left; font-size: 0.7rem; color: #888; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid #2a2d3a; }
        .rev-table td { padding: 12px; border-bottom: 1px solid #1a1d27; font-size: 0.85rem; }
        .rev-table tr:hover td { background: #1e2130; }

        .dataset-bar { margin-bottom: 16px; }
        .dataset-bar-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .dataset-bar-name { font-size: 0.82rem; color: #ccc; }
        .dataset-bar-val { font-size: 0.82rem; color: #c9a84c; font-weight: 700; }
        .bar-bg { height: 8px; background: #0f1117; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #c9a84c, #e0c068); border-radius: 4px; }

        .buyer-card { background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
        .buyer-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .buyer-card-name { font-size: 0.9rem; font-weight: 700; color: #fff; }
        .buyer-card-total { font-size: 1rem; font-weight: 700; color: #c9a84c; }
        .buyer-card-meta { font-size: 0.75rem; color: #888; }

        .cspr-badge { display: inline-block; background: #1a2a1a; border: 1px solid #55a055; color: #55a055; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; }

        .admin-notice { background: #2a1a1a; border: 1px solid #e05555; border-radius: 6px; padding: 14px 18px; margin-bottom: 24px; font-size: 0.85rem; color: #e05555; display: none; }
        .admin-notice.visible { display: block; }

        .empty { text-align: center; color: #555; padding: 40px; }
        .no-access { text-align: center; color: #888; padding: 60px; font-size: 0.9rem; }
        .no-access a { color: #c9a84c; }

        .tx-filter-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
        .tx-filter-bar input, .tx-filter-bar select {
            background: #0f1117; border: 1px solid #2a2d3a; border-radius: 4px;
            padding: 6px 10px; color: #e0e0e0; font-size: 0.82rem;
        }
        .tx-filter-bar input:focus, .tx-filter-bar select:focus { outline: none; border-color: #c9a84c; }
        .tx-meta { font-size: 0.75rem; color: #555; margin-bottom: 10px; }
        .pagination { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
        .page-btn { background: #0f1117; border: 1px solid #2a2d3a; color: #888; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .page-btn:hover { border-color: #c9a84c; color: #c9a84c; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info { font-size: 0.78rem; color: #555; }
        .btn-sm-outline { background: none; border: 1px solid #444; color: #888; border-radius: 4px; padding: 5px 12px; font-size: 0.78rem; cursor: pointer; }
        .btn-sm-outline:hover { border-color: #888; color: #ccc; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>⚒ FORGE SELLER DASHBOARD</h1>
        <p id="sellerSubtitle">Revenue Tracking</p>
    </div>
    <div class="nav-links">
        <a href="/static/index.html" class="nav-link">+ Assess</a>
        <a href="/static/registry.html" class="nav-link">Registry</a>
        <a href="/static/marketplace.html" class="nav-link">Marketplace</a>
        <a href="/static/buyer_dashboard.html" class="nav-link">Buyer</a>
        <a href="/static/seller_dashboard.html" class="nav-link active">Seller</a>
    </div>
</header>

<div class="container" id="mainContent">
    <div class="no-access" id="noAccessMsg" style="display:none">
        You are not registered as a seller. <a href="/static/register.html">Register</a> and opt in to sell data.
    </div>
</div>

<script>
const API = window.location.origin;

async function init() {
    const isAdmin  = localStorage.getItem('forge_is_admin')  === '1';
    const isSeller = localStorage.getItem('forge_is_seller') === '1';
    const userName = localStorage.getItem('forge_user_name') || '';
    const userId   = localStorage.getItem('forge_user_id')   || '';

    if (!isAdmin && !isSeller) {
        document.getElementById('noAccessMsg').style.display = 'block';
        return;
    }

    if (isAdmin) {
        document.getElementById('sellerSubtitle').textContent = 'All Sellers — Admin View';
        document.getElementById('mainContent').innerHTML = `
            <div class="admin-notice visible">
                🔐 Admin view — showing revenue across all sellers and datasets.
            </div>
            <div id="dashContent"></div>`;
        await loadDashboard(null, true);
    } else {
        document.getElementById('sellerSubtitle').textContent = userName + ' — Your Revenue';
        document.getElementById('mainContent').innerHTML = '<div id="dashContent"></div>';
        await loadDashboard(userId, false);
    }
}

async function loadDashboard(userId, isAdmin) {
    const [revenueRes, txRes] = await Promise.all([
        fetch(API + '/marketplace/seller/revenue'),
        fetch(API + '/marketplace/transactions')
    ]);

    let revenue = await revenueRes.json();
    let txs     = await txRes.json();

    // Filter by seller if not admin
    if (!isAdmin && userId) {
        const listingsRes = await fetch(API + '/marketplace/listings');
        const listings    = await listingsRes.json();
        const myListings  = listings.filter(l => l.seller_user_id === userId);
        const myListingIds = myListings.map(l => l.listing_id);
        const myDatasetNames = new Set(myListings.map(l => l.dataset_name));

        txs = txs.filter(t => myListingIds.includes(t.listing_id));

        // Build buyer revenue only from this seller's transactions
        const buyerMap = {};
        txs.forEach(t => {
            const key = t.buyer_id;
            if (!buyerMap[key]) {
                buyerMap[key] = {
                    buyer_id:      t.buyer_id,
                    buyer_name:    t.buyer_name || t.buyer_id,
                    total_spent:   0,
                    total_records: 0,
                    import_count:  0,
                    last_import:   null
                };
            }
            buyerMap[key].total_spent   += t.amount || 0;
            buyerMap[key].total_records += t.records_delivered || 0;
            buyerMap[key].import_count  += 1;
            buyerMap[key].last_import    = t.transacted_at;
        });

        // Build dataset revenue only for this seller's datasets
        const datasetMap = {};
        txs.forEach(t => {
            const listing = myListings.find(l => l.listing_id === t.listing_id);
            const name = listing ? listing.dataset_name : 'Listing #' + t.listing_id;
            if (!datasetMap[name]) {
                datasetMap[name] = { dataset_name: name, total_revenue: 0, total_records: 0, import_count: 0 };
            }
            datasetMap[name].total_revenue += t.amount || 0;
            datasetMap[name].total_records += t.records_delivered || 0;
            datasetMap[name].import_count  += 1;
        });

        revenue = {
            total_revenue: txs.reduce((s, t) => s + (t.amount || 0), 0),
            total_records: txs.reduce((s, t) => s + (t.records_delivered || 0), 0),
            total_imports: txs.length,
            by_buyer:      Object.values(buyerMap),
            by_dataset:    Object.values(datasetMap)
        };
    }

    const content = document.getElementById('dashContent');
    content.innerHTML = `
        <div class="stats-grid">
            <div class="stat-box"><div class="val">${revenue.total_revenue.toFixed(4)}</div><div class="lbl">Total Revenue (CSPR)</div></div>
            <div class="stat-box"><div class="val">${revenue.total_records.toLocaleString()}</div><div class="lbl">Records Delivered</div></div>
            <div class="stat-box"><div class="val">${revenue.total_imports}</div><div class="lbl">Total Transactions</div></div>
            <div class="stat-box"><div class="val">${revenue.by_buyer.length}</div><div class="lbl">Active Buyers</div></div>
        </div>

        <div class="two-col">
            <div class="card">
                <h2>Revenue by Dataset</h2>
                <div id="datasetRevenue"></div>
            </div>
            <div class="card">
                <h2>Revenue by Buyer</h2>
                <div id="buyerRevenue"></div>
            </div>
        </div>

        <div class="card">
            <h2>Transaction Ledger</h2>
            <div id="txLedger"></div>
        </div>`;

    renderDatasets(revenue.by_dataset);
    renderBuyers(revenue.by_buyer);
    renderTransactions(txs);
}

function renderDatasets(datasets) {
    if (!datasets || !datasets.length) {
        document.getElementById('datasetRevenue').innerHTML = '<div class="empty">No dataset revenue yet.</div>';
        return;
    }
    const maxRev = Math.max(...datasets.map(d => d.total_revenue));
    document.getElementById('datasetRevenue').innerHTML = datasets.map(d => `
        <div class="dataset-bar">
            <div class="dataset-bar-header">
                <div class="dataset-bar-name">${d.dataset_name}</div>
                <div class="dataset-bar-val">${d.total_revenue.toFixed(4)} CSPR</div>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" style="width:${maxRev > 0 ? (d.total_revenue/maxRev*100) : 0}%"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:4px;">
                <span style="font-size:0.7rem; color:#555;">${d.import_count} transaction${d.import_count !== 1 ? 's' : ''}</span>
                <span style="font-size:0.7rem; color:#555;">${d.total_records.toLocaleString()} records delivered</span>
            </div>
        </div>`).join('');
}

function renderBuyers(buyers) {
    if (!buyers || !buyers.length) {
        document.getElementById('buyerRevenue').innerHTML = '<div class="empty">No buyers yet.</div>';
        return;
    }
    const sorted = [...buyers].sort((a, b) => b.total_spent - a.total_spent);
    document.getElementById('buyerRevenue').innerHTML = sorted.map(b => `
        <div class="buyer-card">
            <div class="buyer-card-header">
                <div class="buyer-card-name">${b.buyer_name || b.buyer_id}</div>
                <div class="buyer-card-total">${b.total_spent.toFixed(4)} <span class="cspr-badge">CSPR</span></div>
            </div>
            <div class="buyer-card-meta">
                ${b.import_count} import${b.import_count !== 1 ? 's' : ''} &nbsp;·&nbsp;
                ${b.total_records.toLocaleString()} records &nbsp;·&nbsp;
                Last: ${formatDate(b.last_import)}
            </div>
        </div>`).join('');
}

let allTxs = [];
let filteredTxs = [];
let txPage = 1;
const TX_PAGE_SIZE = 10;

function renderTransactions(txs) {
    allTxs = txs;
    filteredTxs = [...txs];
    txPage = 1;

    // Get unique buyers and listings for filters
    const buyers   = [...new Set(txs.map(t => t.buyer_name || t.buyer_id))].filter(Boolean);
    const listings = [...new Set(txs.map(t => t.listing_id))];

    document.getElementById('txLedger').innerHTML = `
        <div class="tx-filter-bar">
            <input type="text" id="txBuyerFilter" placeholder="Filter by buyer..." oninput="applyTxFilters()">
            <select id="txListingFilter" onchange="applyTxFilters()">
                <option value="">All listings</option>
                ${listings.map(id => `<option value="${id}">Listing #${id}</option>`).join('')}
            </select>
            <span class="tx-meta" id="txMeta"></span>
            <button class="btn-sm-outline" onclick="clearTxFilters()">Clear</button>
        </div>
        <div id="txTableContainer"></div>
        <div class="pagination" id="txPagination" style="display:none">
            <button class="page-btn" id="txPrevBtn" onclick="txChangePage(-1)">← Prev</button>
            <span class="page-info" id="txPageInfo"></span>
            <button class="page-btn" id="txNextBtn" onclick="txChangePage(1)">Next →</button>
        </div>`;

    renderTxPage();
}

function applyTxFilters() {
    const buyerF   = document.getElementById('txBuyerFilter').value.toLowerCase();
    const listingF = document.getElementById('txListingFilter').value;
    filteredTxs = allTxs.filter(t => {
        const mb = !buyerF   || (t.buyer_name || t.buyer_id || '').toLowerCase().includes(buyerF);
        const ml = !listingF || String(t.listing_id) === listingF;
        return mb && ml;
    });
    txPage = 1;
    renderTxPage();
}

function clearTxFilters() {
    document.getElementById('txBuyerFilter').value = '';
    document.getElementById('txListingFilter').value = '';
    filteredTxs = [...allTxs];
    txPage = 1;
    renderTxPage();
}

function txChangePage(delta) {
    const totalPages = Math.ceil(filteredTxs.length / TX_PAGE_SIZE);
    const newPage = txPage + delta;
    if (newPage >= 1 && newPage <= totalPages) { txPage = newPage; renderTxPage(); }
}

function renderTxPage() {
    const total      = allTxs.length;
    const filtered   = filteredTxs.length;
    const totalPages = Math.ceil(filtered / TX_PAGE_SIZE);
    const start      = (txPage - 1) * TX_PAGE_SIZE;
    const page       = filteredTxs.slice(start, start + TX_PAGE_SIZE);

    const meta = document.getElementById('txMeta');
    if (meta) meta.textContent = `${filtered} of ${total} transaction${total !== 1 ? 's' : ''}${filtered < total ? ' (filtered)' : ''}`;

    if (!page.length) {
        document.getElementById('txTableContainer').innerHTML = '<div class="empty">No matching transactions.</div>';
        document.getElementById('txPagination').style.display = 'none';
        return;
    }

    document.getElementById('txTableContainer').innerHTML = `
        <table class="rev-table">
            <thead><tr>
                <th>TX ID</th><th>Buyer</th><th>Listing</th>
                <th>Amount</th><th>Records</th><th>Time</th><th>Hash</th><th>Status</th>
            </tr></thead>
            <tbody>
                ${page.map(t => `
                    <tr>
                        <td style="color:#555;">#${t.id}</td>
                        <td>${t.buyer_name || t.buyer_id}</td>
                        <td style="color:#888; font-size:0.75rem;">Listing #${t.listing_id}</td>
                        <td style="color:#c9a84c; font-weight:700;">${t.amount} ${t.currency}</td>
                        <td>${t.records_delivered || '—'}</td>
                        <td style="font-size:0.75rem; color:#888;">${formatDate(t.transacted_at)}</td>
                        <td style="font-family:monospace; font-size:0.68rem; color:#c9a84c;">
                            ${t.casper_tx_hash ? t.casper_tx_hash.substring(0,16)+'...' : '—'}
                        </td>
                        <td><span class="cspr-badge">${t.status}</span></td>
                    </tr>`).join('')}
            </tbody>
        </table>`;

    if (totalPages > 1) {
        document.getElementById('txPagination').style.display = 'flex';
        document.getElementById('txPageInfo').textContent = `Page ${txPage} of ${totalPages}`;
        document.getElementById('txPrevBtn').disabled = txPage <= 1;
        document.getElementById('txNextBtn').disabled = txPage >= totalPages;
    } else {
        document.getElementById('txPagination').style.display = 'none';
    }
}

function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
           ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

init();
</script>
    <script src="/static/shared_header.js"></script>
    <script>document.addEventListener('DOMContentLoaded', initForgeSession);</script>
</body>
</html>
